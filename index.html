

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAKH AI MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b20;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:linear-gradient(135deg,#5424a8,#d6299a)}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
main{max-width:650px;margin:25px auto;padding:20px}
.card{background:#201735;padding:22px;border-radius:18px;border:1px solid #493364}
label{display:block;margin:17px 0 7px;font-weight:bold}
input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #5b4777;background:#120d20;color:white;font-size:16px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#e333a3;color:white;font-weight:bold;font-size:17px}
#result{display:none;margin-top:20px;padding:15px;background:#120d20;border-radius:10px;overflow-wrap:anywhere}
small{color:#c7b8dc}
footer{text-align:center;padding:25px;color:#bdb0d2}
</style>
</head>
<body>
<header>
<h1>🎧 RAKH AI MUSIC</h1>
<p>Create your next hit with VDJ RAKH 254</p>
</header>
<main>
<div class="card">
<h2>🎵 Create Your Song</h2>
<label for="title">Song title</label>
<input id="title" placeholder="Enter your song title">
<label for="genre">Choose genre</label>
<select id="genre">
<option>Dancehall</option><option>Bongo Flava</option>
<option>Mugithi</option><option>Afrobeat</option>
<option>Reggae</option><option>Rumba</option>
<option>Gospel</option><option>Hip Hop</option>
</select>
<label for="language">Song language</label>
<select id="language">
<option>Swahili + English</option><option>Swahili</option>
<option>English</option><option>Kikuyu</option>
<option>Kikuyu + Swahili</option>
</select>
<label for="voice">Vocal style</label>
<select id="voice">
<option>Male vocals</option><option>Female vocals</option>
<option>Male and female duet</option><option>Instrumental only</option>
</select>
<label for="idea">Describe your song</label>
<textarea id="idea" placeholder="Write your song idea, mood, message and beat..."></textarea>
<label for="lyrics">Your lyrics (optional)</label>
<textarea id="lyrics" placeholder="Paste your lyrics here..."></textarea>
<button onclick="prepareSong()">✨ Prepare My Song</button>
<div id="result"></div>
</div>
<p><small>Note: This starter app prepares your song brief. Real AI audio, singing vocals and MP3 downloads require an AI music service connection.</small></p>
</main>
<footer>RAKH AI MUSIC • VDJ RAKH 254</footer>
<script>
function prepareSong(){
const title=document.getElementById('title').value.trim()||'Untitled Song';
const genre=document.getElementById('genre').value;
const language=document.getElementById('language').value;
const voice=document.getElementById('voice').value;
const idea=document.getElementById('idea').value.trim();
const lyrics=document.getElementById('lyrics').value.trim();
const result=document.getElementById('result');
result.style.display='block';
result.innerHTML='';
const heading=document.createElement('h3');
heading.textContent='Your Song Brief: '+title;
result.appendChild(heading);
const details=document.createElement('p');
details.textContent='Genre: '+genre+' | Language: '+language+' | Vocals: '+voice;
result.appendChild(details);
const description=document.createElement('p');
description.textContent='Song idea: '+(idea||'Add your song idea to personalise this brief.');
result.appendChild(description);
const lyricHeading=document.createElement('strong');
lyricHeading.textContent='Lyrics';
result.appendChild(lyricHeading);
const lyricText=document.createElement('p');
lyricText.textContent=lyrics||'No lyrics added yet.';
result.appendChild(lyricText);
const note=document.createElement('p');
note.textContent='Next step: connect an AI music generation service to create audio.';
result.appendChild(note);
}
</script>
</body>
</html>
